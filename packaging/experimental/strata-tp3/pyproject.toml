[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-sparkrun-experimental"
version = "0.1.0"
description = "Experimental native Strata TP3 runtime for SparkRun"
requires-python = ">=3.11"
dependencies = ["sparkrun>=0.4.1,<0.5"]

[project.entry-points."sparkrun.plugins"]
strata-native = "strata_sparkrun"

[tool.setuptools.packages.find]
include = ["strata_sparkrun*"]
